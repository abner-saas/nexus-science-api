# Nexus Science API — stack KVM1 (limites de memória)
# Uso: docker compose --env-file .env.docker up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_science}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=40
    # Apenas rede interna — não publicar 5432 na internet
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus} -d ${POSTGRES_DB:-nexus_science}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexus_science}
      HOST: 0.0.0.0
      PORT: 3333
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3333"
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
