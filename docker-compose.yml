# Nexus Science API — stack KVM1 (limites de memória)
# Uso: docker compose --env-file .env.docker up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_science}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=40
    # Apenas rede interna — não publicar 5432 na internet
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus} -d ${POSTGRES_DB:-nexus_science}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexus_science}
      HOST: 0.0.0.0
      PORT: 3333
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3333"
    networks:
      - default
      - shared_caddy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3333/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"

networks:
  default:
  # Pre-existing Caddy instance on this VPS (shared with another project) handles
  # TLS/reverse-proxy for all sites on the box — see ../CLAUDE.md "Shared VPS" note.
  shared_caddy:
    name: upi-avatar-napsi-backend_default
    external: true

volumes:
  postgres_data:
