name: Deploy KVM1

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-kvm1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy via Tailscale
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check production env blobs
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          DOCKER_ENV: ${{ secrets.DOCKER_ENV }}
        run: python3 scripts/check-prod-env.py

      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          version: latest

      - name: Sync env from GitHub to VPS
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          DOCKER_ENV: ${{ secrets.DOCKER_ENV }}
        run: |
          set -euo pipefail
          python3 -c 'import os,sys; sys.stdout.write(os.environ["APP_ENV"])' \
            | tailscale ssh root@100.104.206.21 'cat > /opt/nexus-science-api/.env && chmod 600 /opt/nexus-science-api/.env'
          python3 -c 'import os,sys; sys.stdout.write(os.environ["DOCKER_ENV"])' \
            | tailscale ssh root@100.104.206.21 'cat > /opt/nexus-science-api/.env.docker && chmod 600 /opt/nexus-science-api/.env.docker'

      - name: Deploy over Tailscale SSH
        run: |
          tailscale ssh root@100.104.206.21 -- bash -s <<'EOF'
          set -euo pipefail
          cd /opt/nexus-science-api
          git fetch origin main
          git reset --hard origin/main
          chmod +x scripts/deploy-remote.sh
          bash scripts/deploy-remote.sh
          EOF
